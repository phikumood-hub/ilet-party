<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFD23F;--card:#fff;--ink:#000;--line:#000}
[data-theme=dark]{--bg:#17142b;--card:#26223f;--ink:#fff;--line:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Kanit,sans-serif}
main{max-width:560px;margin:auto;padding:16px}main.wide{max-width:900px}
.card{background:var(--card);border:3px solid var(--line);box-shadow:7px 7px 0 var(--line);padding:18px;margin:0 0 22px}
h1{font-size:2.3rem;line-height:1.2;margin:8px 0 18px;font-weight:800}
label,legend{display:block;font-weight:600;margin-top:14px}
fieldset{border:0;padding:0;margin:0}
.opt{display:flex;gap:10px;border:2px solid var(--line);padding:8px 10px;margin-top:8px;font-weight:400;cursor:pointer}
.opt:has(:checked){background:#4DE0A6;color:#000}
input:not([type=radio]),select{width:100%;font:inherit;padding:10px;border:3px solid var(--line);background:var(--card);color:var(--ink);margin-top:6px}
button{font:600 1rem Kanit,sans-serif;background:#FF6B9E;color:#000;border:3px solid var(--line);box-shadow:4px 4px 0 var(--line);padding:9px 16px;margin:12px 8px 0 0;cursor:pointer}
button:active{transform:translate(4px,4px);box-shadow:none}button:disabled{opacity:.5}
button.alt{background:#8EA2FF}
:focus-visible{outline:4px solid #5B7CFF;outline-offset:2px}
.hide{display:none!important}
#msg{position:sticky;top:8px;z-index:2;background:#fff;color:#000;border:3px solid #000;padding:10px}
.price{font-size:2.8rem;font-weight:800}img{max-width:100%}
</style></head><body><main id="main">
<button class="alt" id="mode">สลับโหมดสว่าง/มืด</button>
<h1>ลงทะเบียน<br>งานบายเนียร์</h1>
<div id="msg" class="hide" role="alert"></div>

<form id="login" class="card page">
<label>อีเมลมหาวิทยาลัย<input type="email" id="email" required placeholder="name@kmutnb.ac.th"></label>
<button>เข้าสู่ระบบ</button><button type="button" class="alt" id="toAdmin">ผู้ดูแลระบบ</button>
</form>

<form id="form" class="page hide">
<section class="card" id="info"></section>
<section class="card">
<label>ชื่อ-สกุล<input name="name" required maxlength="100" placeholder="เช่น สวัสดี วันจันทร์"></label>
<div id="gYear"></div><input name="yearOther" class="hide" placeholder="ระบุสถานะ / ชั้นปี">
<div id="gJoin"></div>
<div id="going" class="hide">
<div id="gTravel"></div><input name="travelOther" class="hide" placeholder="ระบุการเดินทาง">
<label>แพ้อาหาร (ถ้าไม่แพ้ใส่ -)<input name="allergy" placeholder="เช่น กุ้ง ปลา"></label>
<div id="gAlc"></div>
</div>
<button id="next">ถัดไป</button>
</section></form>

<form id="pay" class="card page hide">
<h2>ชำระเงิน</h2><div class="price" id="price"></div>
<p>ธนาคารกรุงเทพ<br>ชื่อบัญชี อาริตา บัวจีน<br><b id="acc">589-4-454213</b></p>
<button type="button" id="copy">คัดลอกเลขบัญชี</button>
<label>แนบสลิป<input type="file" id="slip" accept="image/*" required></label>
<button type="button" class="alt" id="back">ย้อนกลับ</button><button id="send">ยืนยันการลงทะเบียน</button>
</form>

<section id="done" class="card page hide"></section>

<form id="alogin" class="card page hide"><label>รหัสผ่านผู้ดูแล<input type="password" id="pw" required></label><button>เข้าหลังบ้าน</button></form>

<section id="admin" class="page hide">
<div class="card"><b id="stats"></b><input id="q" placeholder="ค้นหาชื่อ อีเมล ชั้นปี">
<button id="export">ส่งออกเป็น Google Sheet</button><button class="alt" id="reload">โหลดใหม่</button><p id="link"></p></div>
<form id="edit" class="card hide"></form><div id="list"></div>
</section>
</main>
<script>
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
let C, email='', token='', rows=[];
const say=t=>{$('#msg').textContent=t||'';$('#msg').classList.toggle('hide',!t)};
const show=id=>{document.querySelectorAll('.page').forEach(e=>e.classList.toggle('hide',e.id!==id));$('#main').classList.toggle('wide',id==='admin');say();scrollTo(0,0)};
function call(fn,...a){
  say('กำลังดำเนินการ...');
  document.querySelectorAll('button').forEach(b=>b.disabled=true);
  const end=()=>document.querySelectorAll('button').forEach(b=>b.disabled=!C);
  return new Promise((ok,no)=>google.script.run
    .withSuccessHandler(r=>{end();say();ok(r)})
    .withFailureHandler(e=>{end();say(e.message.replace(/^Error: /,''));no(e)})[fn](...a));
}
function theme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('t',t)}catch(e){}}
try{theme(localStorage.getItem('t')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))}catch(e){}
$('#mode').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');
const radios=(n,title,list)=>`<fieldset><legend>${title}</legend>${list.map(v=>`<label class="opt"><input type="radio" name="${n}" value="${v}" required>${v}</label>`).join('')}</fieldset>`;
call('getConfig').then(c=>{C=c;document.querySelectorAll('button').forEach(b=>b.disabled=false);
  $('#info').innerHTML=`<h2>รายละเอียดงาน</h2><b>ธีม:</b> ${c.THEME}<br><b>วันที่:</b> ${c.DATE}<br><b>เวลา:</b> ${c.TIME}<br><b>สถานที่:</b> ${c.PLACE}`;
  $('#gYear').innerHTML=radios('year','ชั้นปี',Object.keys(c.FEES));
  $('#gJoin').innerHTML=radios('join','ความประสงค์เข้าร่วมงาน',['เข้าร่วม','ไม่เข้าร่วม']);
  $('#gTravel').innerHTML=radios('travel','การเดินทางมาร่วมงาน',c.TRAVEL);
  $('#gAlc').innerHTML=radios('alcohol','ดื่มเครื่องดื่มแอลกอฮอล์หรือไม่',['ดื่ม','ไม่ดื่ม']);
  sync();
});
const F=$('#form'), data=()=>Object.fromEntries(new FormData(F));
const fee=d=>d.join==='เข้าร่วม'?C.FEES[d.year]||0:0;
function sync(){
  const d=data(), go=d.join==='เข้าร่วม';
  $('#going').classList.toggle('hide',!go);
  $('#going').querySelectorAll('input').forEach(i=>{if(i.name!=='travelOther')i.required=go});
  [['yearOther',d.year==='อื่นๆ'],['travelOther',go&&d.travel==='อื่นๆ']].forEach(([n,on])=>{F[n].classList.toggle('hide',!on);F[n].required=on});
  $('#next').textContent=fee(d)?'ไปหน้าชำระเงิน':'ยืนยันการลงทะเบียน';
}
F.onchange=sync;
$('#login').onsubmit=e=>{e.preventDefault();call('checkEmail',$('#email').value).then(m=>{email=m;show('form')})};
F.onsubmit=e=>{e.preventDefault();const a=fee(data());if(a){$('#price').textContent=a+' บาท';show('pay')}else submit()};
function submit(slip){
  call('register',{...data(),email,slip}).then(r=>{
    $('#done').innerHTML=`<h2>ลงทะเบียนเรียบร้อย</h2><div class="price">#${r.no}</div><p>${r.mail==='ส่งแล้ว'?'ส่งอีเมลยืนยันแล้ว กรุณาตรวจสอบกล่องจดหมาย':'บันทึกข้อมูลแล้ว แต่ส่งอีเมลไม่สำเร็จ กรุณาติดต่อผู้ดูแล'}</p>`;show('done')});
}
function readImage(file){return new Promise((ok,no)=>{
  const img=new Image(), url=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);ok(c.toDataURL('image/jpeg',.85))};
  img.onerror=()=>{say('เปิดรูปไม่ได้ กรุณาใช้ไฟล์ JPG หรือ PNG');no()};img.src=url;
})}
$('#pay').onsubmit=e=>{e.preventDefault();readImage($('#slip').files[0]).then(submit)};
$('#back').onclick=()=>show('form');
$('#copy').onclick=()=>{const n=$('#acc').textContent.replace(/-/g,'');
  const fail=()=>say('คัดลอกอัตโนมัติไม่ได้ เลขบัญชี: '+n);
  navigator.clipboard?navigator.clipboard.writeText(n).then(()=>say('คัดลอกเลขบัญชีแล้ว'),fail):fail()};

// หลังบ้าน
$('#toAdmin').onclick=()=>show('alogin');
$('#alogin').onsubmit=e=>{e.preventDefault();call('adminLogin',$('#pw').value).then(t=>{token=t;$('#pw').value='';show('admin');load()})};
const load=()=>call('adminList',token).then(r=>{rows=r;draw()});
function draw(){
  const go=rows.filter(r=>r.join==='เข้าร่วม'), paid=rows.filter(r=>r.payStatus==='ชำระแล้ว').reduce((s,r)=>s+Number(r.amount),0);
  $('#stats').textContent=`ตอบกลับ ${rows.length} คน | เข้าร่วม ${go.length} | ดื่ม ${go.filter(r=>r.alcohol==='ดื่ม').length} | ยอดที่ตรวจแล้ว ${paid} บาท`;
  const q=$('#q').value.toLowerCase();
  $('#list').innerHTML=rows.filter(r=>[r.name,r.email,r.year].join(' ').toLowerCase().includes(q)).map(r=>`<div class="card"><b>#${esc(r.no)} ${esc(r.name)}</b><br>${esc(r.email)}<br>${esc(r.year)} ${esc(r.yearOther)} | ${esc(r.join)} | ${esc(r.travel)} ${esc(r.travelOther)}<br>แพ้อาหาร: ${esc(r.allergy)} | ${esc(r.alcohol)}<br>${esc(r.amount)} บาท: ${esc(r.payStatus)} | อีเมล: ${esc(r.mailStatus)}<br>
  <button data-a="edit" data-id="${r.id}">แก้ไข</button>${r.slip?`<button class="alt" data-a="slip" data-id="${r.id}">ดูสลิป</button>`:''}<button class="alt" data-a="mail" data-id="${r.id}">ส่งอีเมลอีกครั้ง</button><button data-a="del" data-id="${r.id}">ลบ</button><div></div></div>`).join('')||'<div class="card">ยังไม่มีข้อมูลที่ตรงกัน</div>';
}
$('#q').oninput=draw;$('#reload').onclick=load;
$('#export').onclick=()=>call('adminExport',token).then(u=>$('#link').innerHTML=`<a style="color:inherit" target="_blank" href="${u}">เปิด Google Sheet ที่ส่งออก</a>`);
$('#list').onclick=e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const r=rows.find(x=>x.id===b.dataset.id), a=b.dataset.a, box=b.parentNode.lastElementChild;
  if(a==='del'&&confirm('ลบข้อมูลของ '+r.name+' ?'))call('adminDelete',token,r.id).then(load);
  if(a==='slip')call('adminSlip',token,r.id).then(u=>box.innerHTML=`<img alt="สลิป" src="${u}">`);
  if(a==='mail'&&confirm('ส่งอีเมลถึง '+r.email+' ?'))call('adminResend',token,r.id).then(load);
  if(a==='edit')editor(r);
};
function editor(r){
  const names={no:'ลำดับ',time:'เวลา',email:'อีเมล',name:'ชื่อ-สกุล',year:'ชั้นปี',yearOther:'ชั้นปี (ระบุ)',join:'เข้าร่วม',travel:'การเดินทาง',travelOther:'เดินทาง (ระบุ)',allergy:'แพ้อาหาร',alcohol:'แอลกอฮอล์',amount:'ยอดเงิน',payStatus:'สถานะชำระ',mailStatus:'สถานะอีเมล'};
  const opts={year:Object.keys(C.FEES),join:['เข้าร่วม','ไม่เข้าร่วม'],travel:['',...C.TRAVEL],alcohol:['','ดื่ม','ไม่ดื่ม'],payStatus:['รอตรวจสอบ','ชำระแล้ว','สลิปไม่ถูกต้อง','ไม่ต้องชำระ']};
  const f=$('#edit');
  f.innerHTML=Object.entries(names).map(([k,t])=>`<label>${t}${opts[k]?`<select name="${k}">${opts[k].map(v=>`<option ${v===r[k]?'selected':''}>${v}</option>`).join('')}</select>`:`<input name="${k}" value="${esc(r[k])}">`}</label>`).join('')+'<label>เปลี่ยนรูปสลิป<input type="file" id="newSlip" accept="image/*"></label><button>บันทึก</button><button type="button" class="alt" id="cancel">ยกเลิก</button>';
  f.classList.remove('hide');f.scrollIntoView();
  $('#cancel').onclick=()=>f.classList.add('hide');
  f.onsubmit=async e=>{e.preventDefault();const d={...Object.fromEntries(new FormData(f)),id:r.id}, file=$('#newSlip').files[0];
    const slip=file?await readImage(file):'';
    call('adminSave',token,d,slip).then(()=>{f.classList.add('hide');load()})};
}
</script></body></html>
